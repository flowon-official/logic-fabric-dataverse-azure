metadata:
  template: logic-fabric-foundry@1.0.0

# Infrastructure only: the apps run published images chosen by the imageTag parameter, so there is
# nothing for azd to build or deploy. `azd provision` and `azd up` do the same thing.
infra:
  provider: bicep
  path: ./infra
